# Publishes the app on GitHub Pages, from the gh-pages branch:
#   main  ->  https://<owner>.github.io/<repo>/
# This repository receives each released version; every push to main is a release.
# Fixed copies of releases (v/) are published by release.yml and kept here.
name: Deploy

on:
  push:
    branches: [main]

# Shares the gh-pages branch with the Release workflow, so they run one at a time.
concurrency:
  group: gh-pages
  cancel-in-progress: false

permissions:
  contents: write # push to the gh-pages branch

jobs:
  live-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # Tell GitHub Pages to serve the files as they are, without Jekyll.
      - run: touch app/dist/.nojekyll
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: app/dist
          branch: gh-pages
          # Keep pull request previews and versioned releases when main is redeployed.
          clean-exclude: |
            pr-preview/
            v/
