# Checks every pull request and every push to main.
# Only merge a pull request when this passes. To make GitHub enforce that, add a ruleset
# for main that requires the "check", "e2e" and "traceability" statuses
# (Settings > Rules > Rulesets).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # The test results, for the traceability job below.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/reports/unit-tests.json
      - run: npm run build

  # The built app in a real browser at phone size, with a fake camera (app/e2e/).
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: app/reports/e2e-tests.json
      # On failure, the report (with a trace of each failed test) is downloadable from the run.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 14

  # Which tests verify each requirement in spec/requirements.json, and whether they passed.
  # The matrix appears on this run's summary page and can be downloaded as an artifact.
  traceability:
    needs: [check, e2e]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-test-results'
          merge-multiple: true
          path: app/reports
      - run: npm run trace
      - if: always()
        run: cat reports/traceability.md >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traceability-matrix
          path: app/reports/traceability.md
